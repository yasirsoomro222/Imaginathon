{% extends "admin/_layout.html" %}

{% block page_title %}Add Assessment — {{ course.code }}{% endblock %}

{% block page_content %}
<h4 class="mb-4">Add Assessment — {{ course.code }}</h4>

<div class="card border-0 shadow-sm" style="max-width: 640px;">
    <div class="card-body">
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Title <span class="text-danger">*</span></label>
                    <input class="form-control" name="title" required placeholder="Quiz 1 / Midterm / Final Exam">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Type</label>
                    <select class="form-select" name="type">
                        <option value="quiz">Quiz</option>
                        <option value="assignment">Assignment</option>
                        <option value="midterm">Midterm</option>
                        <option value="final">Final Exam</option>
                        <option value="project">Project</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Total Marks <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" name="total_marks" min="1" required value="50">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Weightage (% of final grade) <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" name="weightage" min="1" max="100" step="0.5" required value="10">
                    <div class="form-text">Current total: {{ course.assessments|sum(attribute='weightage')|int }}%</div>
                </div>
            </div>
            <button class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Add Assessment</button>
            <a href="{{ url_for('admin.assessments', course_id=course.id) }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}

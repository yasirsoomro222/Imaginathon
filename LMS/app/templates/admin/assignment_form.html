{% extends "admin/_layout.html" %}

{% block page_title %}{{ 'Edit Assignment' if assignment else 'New Assignment' }}{% endblock %}

{% block page_content %}
<h4 class="mb-4">{{ 'Edit Assignment — ' + assignment.title if assignment else 'New Assignment' }}</h4>

<div class="card border-0 shadow-sm" style="max-width: 720px;">
    <div class="card-body">
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row">
                <div class="col-md-5 mb-3">
                    <label class="form-label">Course <span class="text-danger">*</span></label>
                    <select class="form-select" name="course_id" required>
                        <option value="" disabled {% if not courses %}selected{% endif %}>— Select course —</option>
                        {% for c in courses %}
                        <option value="{{ c.id }}" {% if assignment and assignment.course_id == c.id %}selected{% endif %}>
                            {{ c.code }} — {{ c.title }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-7 mb-3">
                    <label class="form-label">Title <span class="text-danger">*</span></label>
                    <input class="form-control" name="title" required
                           value="{{ assignment.title if assignment else '' }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Due Date &amp; Time <span class="text-danger">*</span></label>
                    <input type="datetime-local" class="form-control" name="due_date" required
                           value="{{ assignment.due_date.strftime('%Y-%m-%dT%H:%M') if assignment else '' }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Total Marks</label>
                    <input type="number" class="form-control" name="total_marks" min="1"
                           value="{{ assignment.total_marks if assignment else 100 }}">
                </div>
                <div class="col-12 mb-3">
                    <label class="form-label">Description / Instructions</label>
                    <textarea class="form-control" name="description" rows="4">{{ assignment.description if assignment else '' }}</textarea>
                </div>
            </div>
            <button class="btn btn-primary"><i class="bi bi-save me-1"></i>{{ 'Save Changes' if assignment else 'Create Assignment' }}</button>
            <a href="{{ url_for('admin.assignments') }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}

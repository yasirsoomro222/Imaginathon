{% extends "teacher/_layout.html" %}
{% block page_title %}{% if assignment %}Edit{% else %}New{% endif %} Assignment{% endblock %}

{% block page_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>{% if assignment %}Edit{% else %}New{% endif %} Assignment</h2>
    <a href="{{ url_for('teacher.assignments') }}" class="btn btn-outline-secondary">Back</a>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Course</label>
                    <select name="course_id" class="form-select" required>
                        <option value="">-- Select Course --</option>
                        {% for c in courses %}
                        <option value="{{ c.id }}" {% if assignment and assignment.course_id == c.id %}selected{% endif %}>{{ c.code }} — {{ c.title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Title</label>
                    <input type="text" name="title" class="form-control" value="{{ assignment.title if assignment else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Due Date</label>
                    <input type="datetime-local" name="due_date" class="form-control" value="{{ assignment.due_date.strftime('%Y-%m-%dT%H:%M') if assignment else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Total Marks</label>
                    <input type="number" name="total_marks" class="form-control" value="{{ assignment.total_marks if assignment else 100 }}" min="1" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="4">{{ assignment.description if assignment else '' }}</textarea>
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Save Assignment</button>
                <a href="{{ url_for('teacher.assignments') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

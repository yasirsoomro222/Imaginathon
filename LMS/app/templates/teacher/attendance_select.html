{% extends "teacher/_layout.html" %}
{% block page_title %}Mark Attendance{% endblock %}

{% block page_content %}
<h2 class="mb-4">Mark Attendance</h2>

<div class="card border-0 shadow-sm">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Select Course</label>
                    <select name="course_id" class="form-select" required>
                        <option value="">-- Select Course --</option>
                        {% for c in courses %}
                        <option value="{{ c.id }}">{{ c.code }} — {{ c.title }} (Sem {{ c.semester }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Date</label>
                    <input type="date" name="date" class="form-control" value="{{ default_date }}" required>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Proceed</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
